    <!-- Security Headers
         Schriftarten werden lokal ausgeliefert (@fontsource/inter). Externe
         Font-Hosts sind deshalb bewusst nicht mehr erlaubt — font-src 'self'.
         Die Analytics-Hosts unten sind reine Erlaubnis, kein Ladebefehl: geladen
         wird erst, wenn in src/lib/consent.js ein Dienst eingetragen und (bei
         GA4) eingewilligt wurde. Neuer Dienst = Host hier ergänzen. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://plausible.io https://www.googletagmanager.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: https:;
      connect-src 'self' https://xsuiumhdakdmvsqbnnvh.supabase.co https://plausible.io https://www.google-analytics.com https://www.googletagmanager.com;
      frame-src https://app.wissn-ai.de;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
